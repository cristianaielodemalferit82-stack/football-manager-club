<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager Club</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <h1>⚽ Football Manager Club</h1>
    </header>

    <main>

        <button id="btnJugador">
            Añadir jugador
        </button>

        <section id="jugadores">

            <div class="jugador">
                <h3>Lionel Messi</h3>
                <p>Dorsal: 10</p>
                <p>Posición: Delantero</p>

                <button>Editar</button>
                <button>Eliminar</button>
            </div>

            <div class="jugador">
                <h3>Thibaut Courtois</h3>
                <p>Dorsal: 1</p>
                <p>Posición: Portero</p>

                <button>Editar</button>
                <button>Eliminar</button>
            </div>

        </section>

    </main>

    <script src="JS/app.js"></script>

</body>
</html>
