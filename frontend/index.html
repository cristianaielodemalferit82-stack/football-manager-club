<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager Club</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>⚽ Football Manager Club</h1>
    </header>

    <main>

        <button id="btnJugador">
            Añadir jugador
        </button>

        <!-- Formulario para añadir / editar (oculto al principio) -->
        <form id="formJugador" class="oculto">
            <h2 id="tituloForm">Nuevo jugador</h2>

            <label>Nombre
                <input type="text" id="nombre" required>
            </label>

            <label>Apellidos
                <input type="text" id="apellidos" required>
            </label>

            <label>Edad
                <input type="number" id="edad" min="5" max="60">
            </label>

            <label>Dorsal
                <input type="number" id="dorsal" min="1" max="99" required>
            </label>

            <label>Posición
                <select id="posicion" required>
                    <option value="">-- Elige una posición --</option>
                    <option value="Portero">Portero</option>
                    <option value="Defensa">Defensa</option>
                    <option value="Centrocampista">Centrocampista</option>
                    <option value="Delantero">Delantero</option>
                </select>
            </label>

            <label>Equipo
                <input type="text" id="equipo">
            </label>

            <label>Nacionalidad
                <input type="text" id="nacionalidad">
            </label>

            <div class="acciones-form">
                <button type="submit">Guardar</button>
                <button type="button" id="btnCancelar">Cancelar</button>
            </div>
        </form>

        <p id="mensaje"></p>

        <!-- Aquí app.js pinta los jugadores que vienen de MongoDB -->
        <section id="jugadores"></section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
